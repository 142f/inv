- symbol: "USDJPYc"             # 美日
  magic: 1002                   # 策略唯一ID
  lot: 0.08                     # 交易手数
  step: 0.09                  # 网格间距
  tp_dist: 0.11               # 止盈距离
  window: 3                     # 盘口挂单数量 (单边)
  min_p: 150                    # 最小交易价格
  max_p: 170                    # 最大交易价格
  enabled: true                 # 是否启用
  mode: long                 # 多空双开(neutral), 仅做多(long), 仅做空(short)
  use_atr: false                # 是否使用 ATR 动态步长
  atr_period: 20                # ATR 周期
  atr_factor: 1.0               # ATR 系数 (step/tp_dist 共用)
  atr_mode: ema                 # ATR 计算方式: wilder | ema | sma
  adaptive_enabled: true        # 动态参数开关(仅新K线触发)
  adaptive_timeframe: "M15"     # 动态参数周期
  adaptive_lookback: 200        # 回看K线数量
  adaptive_quantile_low: 0.30   # 低波动分位
  adaptive_quantile_high: 0.70  # 高波动分位
  adaptive_step_mult_low: 0.90  # 低波动步长系数
  adaptive_step_mult_high: 1.10 # 高波动步长系数
  adaptive_lot_min_mult: 0.5  # 最小仓位倍数
  adaptive_lot_max_mult: 2.00   # 最大仓位倍数
  adaptive_range_buffer_atr: 1.0 # 区间缓冲(ATR倍数)
  recenter_steps: 2             # 价格偏离多少格后平移 Anchor
  recenter_cooldown: 20         # 平移冷却时间(秒)
  max_net_vol: 5                # 最大净持仓手数 (Neutral 模式风控)

