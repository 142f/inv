  hedge_vol_window: 20          # 当前波动窗口(M1根数)
  hedge_vol_quantile: 0.90      # 波动分位数
  hedge_vol_base: 200           # 成交量基线窗口
  hedge_vol_mult: 2.0           # 成交量倍数阈值
  # ===== 对冲盈利 BE 止损（新增）===== 
  be_trigger_steps: 1           # 盈利达到 1*step 启用 BE
  be_buffer_points: 20          # 止损缓冲点数
